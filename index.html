<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#21201C">
  <meta name="description" content="Furry art, original characters, gallery, and commission information by Shin.">
  <title>Shin Cabinet — Furry Art & Characters</title>
  <link rel="icon" href="/assets/images/branding/favicon.png" type="image/png">
  <link rel="manifest" href="/site.webmanifest">
  <link rel="stylesheet" href="/assets/css/styles.css?v=5">
</head>
<body data-page="home">
<a class="skip-link" href="#main-content">Skip to content</a>
<header class="site-header">
  <div class="site-header__inner">
    <a class="brand" href="/" aria-label="Shin Cabinet home"><span class="brand__text" data-site-name>Shin Cabinet</span></a>
    <button class="menu-toggle" type="button" aria-label="Toggle navigation" aria-expanded="false" data-menu-toggle><span></span></button>
    <nav class="site-nav" aria-label="Primary navigation" data-site-nav></nav>
  </div>
</header>
<main id="main-content">
  <section class="home-intro">
    <div class="home-intro__copy">
      <h1>Shin Cabinet</h1>
      <p data-site-intro>Furry art, character design, and commission information.</p>
      <div class="simple-links" aria-label="Main pages">
        <a href="/gallery/" data-page-link="gallery">Gallery</a>
        <a href="/characters/" data-page-link="characters">Characters</a>
        <a href="/commissions/" data-page-link="commissions">Commission Info</a>
      </div>
    </div>
    <figure class="home-intro__art">
      <span class="home-intro__shape" aria-hidden="true"></span>
      <img src="/assets/images/characters/shin.webp" alt="Shin, an orange, cream, and dark brown fox-wolf character">
    </figure>
  </section>

  <section class="section section--work">
    <div class="section__inner">
      <div class="plain-heading">
        <h2>Recent work</h2>
        <a href="/gallery/" data-page-link="gallery">View gallery</a>
      </div>
      <div class="gallery-grid gallery-grid--home" data-gallery-grid data-featured-only="true" data-limit="4"></div>
    </div>
  </section>

  <dialog id="art-dialog" aria-label="Artwork preview">
    <button class="dialog-close" type="button" aria-label="Close dialog" data-dialog-close>×</button>
    <figure class="art-dialog__figure">
      <img src="" alt="" data-art-dialog-image>
      <figcaption class="art-dialog__caption"><strong data-art-dialog-title></strong><span data-art-dialog-meta></span></figcaption>
    </figure>
  </dialog>
</main>
<footer class="site-footer">
  <div class="site-footer__inner">
    <span>© 2026 <span data-artist-name>Shin</span>. Please do not repost without permission.</span>
    <div class="site-footer__links" data-footer-links></div>
  </div>
</footer>
<script src="/config/pages.js?v=5" defer></script>
<script src="/config/custom-pages.js?v=5" defer></script>
<script src="/assets/js/content.js?v=5" defer></script>
<script src="/assets/js/site.js?v=5" defer></script>
</body>
</html>
